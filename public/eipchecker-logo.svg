<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="eipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#eipGrad)" filter="url(#glow)" />
  <rect x="7.5" y="7.5" width="85" height="85" rx="22.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Ethereum Standard Diamond Core -->
  <!-- Top pyramid left/right -->
  <polygon points="46,20 62,44 46,38" fill="#ffffff" fill-opacity="0.95" />
  <polygon points="46,20 30,44 46,38" fill="#dbeafe" />

  <!-- Bottom diamond left/right -->
  <polygon points="46,42 62,49 46,65" fill="#bfdbfe" fill-opacity="0.8" />
  <polygon points="46,42 30,49 46,65" fill="#93c5fd" fill-opacity="0.9" />

  <!-- Data Flow / Protocol Nodes -->
  <circle cx="22" cy="44" r="2.5" fill="#bfdbfe" />
  <line x1="22" y1="44" x2="30" y2="44" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" />

  <!-- Verification Compliance Badge -->
  <circle cx="70" cy="70" r="18" fill="#ffffff" />
  <circle cx="70" cy="70" r="15" fill="url(#checkGrad)" />
  <path d="M62.5 70.5 L67.5 75.5 L77.5 64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
